spring.application.name=issue-tracker

# Uses DB_PATH if provided (by Docker), otherwise defaults to local ./data/
spring.datasource.url=jdbc:h2:file:${DB_PATH:./data/issues_db};DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update

# Custom configurations
tracker.repo=spring-projects/spring-boot
tracker.label=status: first-timers-only
tracker.poll-interval-ms=300000
tracker.github-token=